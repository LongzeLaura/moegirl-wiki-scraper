# ---- Output paths ----

# All paths are relative to the project root (moegirl-pwb-test/).
output_paths:
  raw_base: "data/raw/moegirl"
  wiki_base: "wiki"
  sources_dir: "wiki/sources/moegirl"
  state_file: "data/raw/moegirl/crawl_state.json"
  log_file: "data/raw/moegirl/crawl_log.jsonl"

# ---- Dry-run ----
# When true, prints crawl plan but does not make real HTTP requests
# (except to fetch seed pages for link discovery).
dry_run: false

# ---- Force ----
# When true, ignores local cache and re-fetches all pages.
force: false
