# fsn_crawl.yaml — Configuration for the FSN-focused Moegirlpedia crawler.
#
# All values can be overridden via command-line arguments.

# ---- Crawl boundaries ----

# Seed pages: starting points for the crawl.
# Use either inline list below or an external file (--seeds).
seeds:
  - "Fate/stay night"
  - "间桐樱"
  - "远坂凛"
  - "卫宫士郎"
  - "Saber (Fate/stay night)"
  - "伊莉雅斯菲尔·冯·爱因兹贝伦"
  - "圣杯战争"

# Maximum link expansion depth. 0 = only seed pages, 1 = seeds + direct links, etc.
max_depth: 1

# Absolute maximum number of pages to crawl (including seeds).
max_pages: 50

# ---- Request politeness ----

# Delay in seconds between successive HTTP requests.
delay_seconds: 4.0

# Random jitter ratio: actual delay = delay * (1 ± jitter_ratio).
# E.g., 0.3 means actual delay is between 2.8 and 5.2 seconds for delay=4.
jitter_ratio: 0.3

# Maximum retries per failed request.
max_retries: 3

# Base delay for exponential backoff on retry (seconds).
retry_base_delay: 10.0

# ---- Relevance threshold ----

# Minimum relevance score for a linked page to be added to the crawl queue.
# Pages scoring below this are skipped. Range: roughly -100 to 50+.
min_relevance_score: 8

# Threshold for marking a page as "FSN-related" (boosts its outgoing links).
fsn_page_threshold: 15

# ---- Keywords ----

# Paths to keyword list files (relative to project root or absolute).
include_keywords_file: "config/fsn_include_keywords.txt"
exclude_keywords_file: "config/fsn_exclude_keywords.txt"

# ---- Namespace filter ----

# Only crawl pages in these namespaces. Empty = mainspace only.
allowed_namespaces: []

# ---- Category rules ----

